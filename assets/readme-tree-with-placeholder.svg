<svg xmlns="http://www.w3.org/2000/svg" width="840" height="472" viewBox="0 0 840 472" role="img" aria-labelledby="title desc">
  <title id="title">gsc tree screenshot placeholder</title>
  <desc id="desc">Placeholder for a screenshot showing gsc tree output with purpose metadata.</desc>
  <rect width="840" height="472" fill="#f6f8fa"/>
  <rect x="24" y="24" width="792" height="424" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="24" y="24" width="792" height="52" rx="12" fill="#24292f"/>
  <text x="52" y="58" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="22">Screenshot placeholder</text>
  <text x="52" y="126" fill="#57606a" font-family="Menlo, Consolas, monospace" font-size="18">$ gsc tree --db code-intent --fields purpose --focus crates/ignore/src</text>
  <text x="52" y="172" fill="#0969da" font-family="Menlo, Consolas, monospace" font-size="18">walk.rs</text>
  <text x="160" y="172" fill="#24292f" font-family="Arial, sans-serif" font-size="19">recursive directory traversal and I/O</text>
  <text x="52" y="218" fill="#0969da" font-family="Menlo, Consolas, monospace" font-size="18">dir.rs</text>
  <text x="160" y="218" fill="#24292f" font-family="Arial, sans-serif" font-size="19">ignore rule loading and matching</text>
  <text x="52" y="264" fill="#0969da" font-family="Menlo, Consolas, monospace" font-size="18">overrides.rs</text>
  <text x="160" y="264" fill="#24292f" font-family="Arial, sans-serif" font-size="19">override rules and precedence</text>
  <text x="52" y="350" fill="#57606a" font-family="Arial, sans-serif" font-size="22">The tree becomes a map of responsibilities.</text>
</svg>
