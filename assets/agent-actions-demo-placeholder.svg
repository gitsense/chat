<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Agent actions demo placeholder</title>
  <desc id="description">Placeholder for a GIF showing agents offering actions to open a terminal, review a diff in Zed, and open a spreadsheet.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6f8fa"/>
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="3" stroke-dasharray="12 12"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="600" y="130" fill="#24292f" font-size="38" font-weight="700">Give your agents more ways to help</text>
    <text x="600" y="178" fill="#57606a" font-size="24">Move from an answer to the next step with one click.</text>
    <circle cx="600" cy="320" r="70" fill="#24292f"/>
    <path d="M578 276 L578 364 L648 320 Z" fill="#ffffff"/>
    <g font-size="22" font-weight="600">
      <rect x="135" y="490" width="260" height="62" rx="12" fill="#ddf4ff" stroke="#0969da"/>
      <text x="265" y="530" fill="#0969da">Open a terminal</text>
      <rect x="470" y="490" width="260" height="62" rx="12" fill="#fff8c5" stroke="#9a6700"/>
      <text x="600" y="530" fill="#9a6700">Review a Zed diff</text>
      <rect x="805" y="490" width="260" height="62" rx="12" fill="#fbefff" stroke="#8250df"/>
      <text x="935" y="530" fill="#8250df">Open a spreadsheet</text>
    </g>
    <text x="600" y="605" fill="#8c959f" font-size="18">GIF placeholder</text>
  </g>
</svg>
