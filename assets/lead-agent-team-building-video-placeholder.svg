<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Lead agent team-building video placeholder</title>
  <desc id="description">A placeholder for one video showing how a user creates a lead agent, explains a problem, scouts existing sessions, assembles a team, and reviews the result.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6f8fa"/>
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="3" stroke-dasharray="12 12"/>

  <text x="600" y="126" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" text-anchor="middle">Lead agent workflow video</text>
  <text x="600" y="170" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" text-anchor="middle">Start with a problem. Build the team around it.</text>

  <circle cx="600" cy="326" r="74" fill="#24292f"/>
  <path d="M578 282 L578 370 L648 326 Z" fill="#ffffff"/>

  <line x1="132" y1="510" x2="1068" y2="510" stroke="#d0d7de" stroke-width="4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g>
      <circle cx="160" cy="510" r="18" fill="#0969da"/>
      <text x="160" y="517" fill="#ffffff" font-size="18" font-weight="700">1</text>
      <text x="160" y="560" fill="#24292f" font-size="18" font-weight="600">Create</text>
    </g>
    <g>
      <circle cx="380" cy="510" r="18" fill="#0969da"/>
      <text x="380" y="517" fill="#ffffff" font-size="18" font-weight="700">2</text>
      <text x="380" y="560" fill="#24292f" font-size="18" font-weight="600">Explain</text>
    </g>
    <g>
      <circle cx="600" cy="510" r="18" fill="#0969da"/>
      <text x="600" y="517" fill="#ffffff" font-size="18" font-weight="700">3</text>
      <text x="600" y="560" fill="#24292f" font-size="18" font-weight="600">Scout</text>
    </g>
    <g>
      <circle cx="820" cy="510" r="18" fill="#0969da"/>
      <text x="820" y="517" fill="#ffffff" font-size="18" font-weight="700">4</text>
      <text x="820" y="560" fill="#24292f" font-size="18" font-weight="600">Execute</text>
    </g>
    <g>
      <circle cx="1040" cy="510" r="18" fill="#0969da"/>
      <text x="1040" y="517" fill="#ffffff" font-size="18" font-weight="700">5</text>
      <text x="1040" y="560" fill="#24292f" font-size="18" font-weight="600">Review</text>
    </g>
  </g>

  <text x="600" y="615" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle">Video placeholder</text>
</svg>
