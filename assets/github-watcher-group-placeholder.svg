<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
  <title id="title">GitHub Watcher Group screenshot placeholder</title>
  <desc id="description">A placeholder for a screenshot showing the GitHub Watcher lead with focused agents for GitHub issues and pull requests.</desc>
  <rect width="1200" height="780" rx="24" fill="#f6f8fa"/>
  <rect x="24" y="24" width="1152" height="732" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="3" stroke-dasharray="12 12"/>
  <g fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="600" y="358" font-size="40" font-weight="700">Screenshot placeholder</text>
    <text x="600" y="414" font-size="28">GitHub Watcher Group</text>
  </g>
</svg>
