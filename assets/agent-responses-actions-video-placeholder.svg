<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Clickable agent response video placeholder</title>
  <desc id="description">A placeholder for a video showing a lead reviewing sessions, creating a report, and returning clickable next steps.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6f8fa"/>
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="3" stroke-dasharray="12 12"/>

  <text x="600" y="126" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" text-anchor="middle">Interactive handoff video</text>
  <text x="600" y="170" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" text-anchor="middle">From session review to clickable next steps</text>

  <circle cx="600" cy="326" r="74" fill="#24292f"/>
  <path d="M578 282 L578 370 L648 326 Z" fill="#ffffff"/>

  <line x1="190" y1="510" x2="1010" y2="510" stroke="#d0d7de" stroke-width="4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g>
      <circle cx="220" cy="510" r="18" fill="#0969da"/>
      <text x="220" y="517" fill="#ffffff" font-size="18" font-weight="700">1</text>
      <text x="220" y="560" fill="#24292f" font-size="18" font-weight="600">Review sessions</text>
    </g>
    <g>
      <circle cx="600" cy="510" r="18" fill="#0969da"/>
      <text x="600" y="517" fill="#ffffff" font-size="18" font-weight="700">2</text>
      <text x="600" y="560" fill="#24292f" font-size="18" font-weight="600">Create report</text>
    </g>
    <g>
      <circle cx="980" cy="510" r="18" fill="#0969da"/>
      <text x="980" y="517" fill="#ffffff" font-size="18" font-weight="700">3</text>
      <text x="980" y="560" fill="#24292f" font-size="18" font-weight="600">Take next step</text>
    </g>
  </g>

  <text x="600" y="615" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle">Video placeholder</text>
</svg>
