<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="950" viewBox="0 0 1750 950">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#53627a"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 36px; font-weight: 700; fill: #172033; }
      .section { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 1.4px; fill: #526178; }
      .heading { font-family: Arial, sans-serif; font-size: 27px; font-weight: 700; fill: #172033; }
      .body { font-family: Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #526178; }
      .label { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #172033; }
      .small { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #65738a; }
      .light-small { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #cbd6e8; }
      .chip { fill: #ffffff; stroke: #cad2df; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #d7dde7; stroke-width: 2; }
      .accent-panel { fill: #f2f6ff; stroke: #7b9cdd; stroke-width: 2.5; }
      .accent { fill: #315eaf; }
      .line { fill: none; stroke: #53627a; stroke-width: 2.5; marker-end: url(#arrow); }
      .both { fill: none; stroke: #53627a; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1750" height="950" fill="#fbfcfe"/>
  <text x="875" y="64" text-anchor="middle" class="title">How GitSense Chat works</text>

  <!-- Existing tools -->
  <text x="80" y="122" class="section">KEEP YOUR CODING WORKFLOW</text>
  <rect x="80" y="146" width="1590" height="154" rx="22" class="panel" filter="url(#shadow)"/>

  <rect x="112" y="191" width="140" height="62" rx="14" class="chip"/>
  <text x="182" y="230" text-anchor="middle" class="label">Claude Code</text>
  <rect x="267" y="191" width="140" height="62" rx="14" class="chip"/>
  <text x="337" y="230" text-anchor="middle" class="label">Codex</text>
  <rect x="422" y="191" width="140" height="62" rx="14" class="chip"/>
  <text x="492" y="230" text-anchor="middle" class="label">OpenCode</text>
  <rect x="577" y="191" width="140" height="62" rx="14" class="chip"/>
  <text x="647" y="230" text-anchor="middle" class="label">Pi</text>
  <rect x="732" y="191" width="140" height="62" rx="14" class="chip"/>
  <text x="802" y="230" text-anchor="middle" class="label">Other agents</text>

  <path d="M 900 222 L 1005 222" class="both"/>
  <rect x="913" y="184" width="78" height="31" rx="15" fill="#e8effc"/>
  <text x="952" y="205" text-anchor="middle" class="small" fill="#315eaf">gsc</text>
  <text x="952" y="270" text-anchor="middle" class="small">Query · Ask · Inform</text>

  <rect x="1035" y="174" width="598" height="96" rx="17" class="accent-panel"/>
  <circle cx="1080" cy="222" r="22" fill="#dce8ff"/>
  <path d="M1068 222h24M1080 210v24" stroke="#315eaf" stroke-width="3" stroke-linecap="round"/>
  <text x="1120" y="214" class="label">Repository intelligence and specialized Pi agents</text>
  <text x="1120" y="244" class="body">Available to any coding agent with access to gsc</text>

  <!-- Two value paths -->
  <text x="80" y="366" class="section">BUILD AND SHARE KNOWLEDGE ACROSS AGENTS</text>
  <rect x="80" y="390" width="760" height="388" rx="22" class="panel" filter="url(#shadow)"/>

  <text x="120" y="442" class="heading">Make specialized knowledge reusable</text>
  <text x="120" y="478" class="body">Query packaged repository knowledge, or ask specialized</text>
  <text x="120" y="505" class="body">Pi agents to interpret the sources they know.</text>

  <rect x="120" y="548" width="310" height="126" rx="16" class="accent-panel"/>
  <text x="275" y="583" text-anchor="middle" class="label">Repository intelligence</text>
  <text x="275" y="616" text-anchor="middle" class="small">Analyzer results and lessons</text>
  <text x="275" y="645" text-anchor="middle" class="small">Manifests you can own and version</text>

  <rect x="490" y="548" width="310" height="126" rx="16" class="accent-panel"/>
  <text x="645" y="583" text-anchor="middle" class="label">Specialized Pi agents</text>
  <text x="645" y="616" text-anchor="middle" class="small">Interpret selected sources</text>
  <text x="645" y="645" text-anchor="middle" class="small">Answer questions and receive updates</text>

  <text x="460" y="735" text-anchor="middle" class="label">Query repository intelligence · Ask or inform Pi agents</text>

  <text x="910" y="366" class="section">UNDERSTAND AND GUIDE THE WORK</text>
  <rect x="910" y="390" width="760" height="388" rx="22" class="panel" filter="url(#shadow)"/>

  <text x="950" y="442" class="heading">Organize Pi sessions into Groups</text>
  <text x="950" y="478" class="body">A lead agent brings together findings and surfaces</text>
  <text x="950" y="505" class="body">dependencies and decisions that need your attention.</text>

  <rect x="940" y="530" width="500" height="190" rx="18" fill="#f8faff" stroke="#9aabd0" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="962" y="559" class="small">GROUP</text>

  <rect x="966" y="576" width="150" height="55" rx="13" class="chip"/>
  <circle cx="990" cy="603" r="8" class="accent"/>
  <text x="1050" y="610" text-anchor="middle" class="label">Pi session</text>
  <rect x="966" y="650" width="150" height="55" rx="13" class="chip"/>
  <circle cx="990" cy="677" r="8" class="accent"/>
  <text x="1050" y="684" text-anchor="middle" class="label">Pi session</text>

  <path d="M 1128 603 L 1204 603" class="line"/>
  <path d="M 1128 677 L 1165 677 L 1165 603 L 1204 603" class="line"/>

  <rect x="1224" y="562" width="186" height="102" rx="18" class="accent-panel"/>
  <text x="1317" y="605" text-anchor="middle" class="small">LEAD AGENT</text>
  <text x="1317" y="635" text-anchor="middle" class="label">Connects the work</text>

  <path d="M 1452 613 L 1482 613" class="line"/>

  <rect x="1500" y="550" width="130" height="133" rx="18" fill="#172033"/>
  <text x="1565" y="582" text-anchor="middle" class="light-small">REPORT</text>
  <text x="1565" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Findings</text>
  <text x="1565" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Evidence</text>
  <text x="1565" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Actions</text>

  <text x="1315" y="748" text-anchor="middle" class="label">Inspect what matters. Choose what happens next.</text>

  <!-- Boundary and caption -->
  <rect x="80" y="814" width="1590" height="52" rx="12" fill="#eef2f7"/>
  <text x="875" y="847" text-anchor="middle" class="small">Knowledge access works across agent harnesses through gsc · Session and Group integration currently uses Pi</text>

  <text x="875" y="916" text-anchor="middle" class="heading">Shared knowledge for your agents. Context and choices for you.</text>
</svg>
