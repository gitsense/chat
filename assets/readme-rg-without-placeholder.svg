<svg xmlns="http://www.w3.org/2000/svg" width="840" height="472" viewBox="0 0 840 472" role="img" aria-labelledby="title desc">
  <title id="title">Plain rg screenshot placeholder</title>
  <desc id="desc">Placeholder for a screenshot showing plain ripgrep output.</desc>
  <rect width="840" height="472" fill="#f6f8fa"/>
  <rect x="24" y="24" width="792" height="424" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="24" y="24" width="792" height="52" rx="12" fill="#24292f"/>
  <text x="52" y="58" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="22">Screenshot placeholder</text>
  <text x="52" y="126" fill="#57606a" font-family="Menlo, Consolas, monospace" font-size="20">$ rg cache</text>
  <text x="52" y="172" fill="#24292f" font-family="Menlo, Consolas, monospace" font-size="18">crates/ignore/src/dir.rs:...</text>
  <text x="52" y="204" fill="#24292f" font-family="Menlo, Consolas, monospace" font-size="18">crates/core/flags/lowargs.rs:...</text>
  <text x="52" y="236" fill="#24292f" font-family="Menlo, Consolas, monospace" font-size="18">tests/search/cache.rs:...</text>
  <text x="52" y="306" fill="#57606a" font-family="Arial, sans-serif" font-size="22">Plain search shows matching lines and paths.</text>
  <text x="52" y="340" fill="#57606a" font-family="Arial, sans-serif" font-size="22">The agent still has to infer which files matter.</text>
</svg>
