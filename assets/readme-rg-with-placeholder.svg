<svg xmlns="http://www.w3.org/2000/svg" width="840" height="472" viewBox="0 0 840 472" role="img" aria-labelledby="title desc">
  <title id="title">gsc rg screenshot placeholder</title>
  <desc id="desc">Placeholder for a screenshot showing gsc rg output with purpose metadata.</desc>
  <rect width="840" height="472" fill="#f6f8fa"/>
  <rect x="24" y="24" width="792" height="424" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="24" y="24" width="792" height="52" rx="12" fill="#24292f"/>
  <text x="52" y="58" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="22">Screenshot placeholder</text>
  <text x="52" y="126" fill="#57606a" font-family="Menlo, Consolas, monospace" font-size="20">$ gsc rg cache --db code-intent --fields purpose</text>
  <text x="52" y="172" fill="#0969da" font-family="Menlo, Consolas, monospace" font-size="18">crates/ignore/src/dir.rs</text>
  <text x="52" y="206" fill="#24292f" font-family="Arial, sans-serif" font-size="20">purpose: Change how ignore rules are loaded and matched.</text>
  <text x="52" y="254" fill="#0969da" font-family="Menlo, Consolas, monospace" font-size="18">crates/core/flags/lowargs.rs</text>
  <text x="52" y="288" fill="#24292f" font-family="Arial, sans-serif" font-size="20">purpose: Change CLI defaults and search configuration.</text>
  <text x="52" y="360" fill="#57606a" font-family="Arial, sans-serif" font-size="22">Same search, plus why each file matters.</text>
</svg>
