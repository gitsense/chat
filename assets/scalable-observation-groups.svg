<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">A Group lead can also be a member of another Group</title>
  <desc id="description">The GitHub Watcher is a member of the My Team Dashboard Group and the lead of another Group containing a GitHub Issues Tracker and Pull Request Monitor. It brings that Group's combined findings back to the larger dashboard.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0969da"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#f6f8fa"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="800" y="64" text-anchor="middle" fill="#1f2328" font-size="38" font-weight="700">A Group lead can also be a member of another Group</text>
    <text x="800" y="104" text-anchor="middle" fill="#59636e" font-size="21">The lead brings the work of its Group into a larger dashboard as one card.</text>

    <rect x="70" y="142" width="1460" height="248" rx="20" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <text x="106" y="187" fill="#1f2328" font-size="24" font-weight="700">My Team Dashboard Group</text>
    <text x="106" y="217" fill="#59636e" font-size="17">One status per area</text>

    <g filter="url(#shadow)">
      <rect x="120" y="244" width="400" height="108" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <circle cx="150" cy="278" r="10" fill="#1a7f37"/>
      <text x="173" y="286" fill="#1f2328" font-size="20" font-weight="700">Product Health Monitor</text>
      <text x="144" y="324" fill="#59636e" font-size="16">Verification needs attention</text>

      <rect x="600" y="244" width="400" height="108" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <circle cx="630" cy="278" r="10" fill="#0969da"/>
      <text x="653" y="286" fill="#1f2328" font-size="20" font-weight="700">GitHub Watcher</text>
      <text x="624" y="324" fill="#59636e" font-size="16">GitHub activity is on track</text>

      <rect x="1080" y="244" width="400" height="108" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <circle cx="1110" cy="278" r="10" fill="#8250df"/>
      <text x="1133" y="286" fill="#1f2328" font-size="20" font-weight="700">Slack Watcher</text>
      <text x="1104" y="324" fill="#59636e" font-size="16">7 new messages · none need attention</text>
    </g>

    <line x1="800" y1="354" x2="800" y2="550" stroke="#0969da" stroke-width="5" marker-end="url(#arrow-blue)"/>
    <rect x="625" y="425" width="350" height="42" rx="21" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="800" y="452" text-anchor="middle" fill="#0969da" font-size="17" font-weight="700">GitHub Watcher leads this Group</text>

    <rect x="260" y="500" width="1080" height="422" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="298" y="548" fill="#1f2328" font-size="25" font-weight="700">GitHub Watcher Group</text>
    <text x="298" y="578" fill="#59636e" font-size="17">Focused observers report to one lead</text>

    <g filter="url(#shadow)">
      <rect x="650" y="568" width="300" height="122" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="4"/>
      <rect x="672" y="586" width="58" height="25" rx="12" fill="#0969da"/>
      <text x="701" y="604" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" letter-spacing="0.7">LEAD</text>
      <text x="674" y="642" fill="#1f2328" font-size="23" font-weight="700">GitHub Watcher</text>
      <text x="674" y="672" fill="#0969da" font-size="16" font-weight="600">Combines and explains findings</text>

      <rect x="366" y="752" width="350" height="120" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/>
      <circle cx="398" cy="789" r="10" fill="#1a7f37"/>
      <text x="421" y="797" fill="#1f2328" font-size="21" font-weight="700">GitHub Issues Tracker</text>
      <text x="390" y="829" fill="#59636e" font-size="16">Tracks issues and triage</text>
      <text x="390" y="854" fill="#1a7f37" font-size="15" font-weight="700">2 new · 1 priority</text>

      <rect x="884" y="752" width="350" height="120" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/>
      <circle cx="916" cy="789" r="10" fill="#1a7f37"/>
      <text x="939" y="797" fill="#1f2328" font-size="21" font-weight="700">Pull Request Monitor</text>
      <text x="908" y="829" fill="#59636e" font-size="16">Tracks reviews and checks</text>
      <text x="908" y="854" fill="#1a7f37" font-size="15" font-weight="700">1 blocked · 3 ready</text>
    </g>

    <path d="M541 750 C541 716 650 704 720 684" fill="none" stroke="#1a7f37" stroke-width="4" marker-end="url(#arrow-green)"/>
    <path d="M1059 750 C1059 716 950 704 880 684" fill="none" stroke="#1a7f37" stroke-width="4" marker-end="url(#arrow-green)"/>
    <rect x="606" y="710" width="388" height="34" rx="17" fill="#ffffff"/>
    <text x="800" y="733" text-anchor="middle" fill="#1a7f37" font-size="16" font-weight="700">Focused findings roll up to the lead</text>

    <text x="800" y="968" text-anchor="middle" fill="#59636e" font-size="18">Talk to the GitHub Watcher card for the combined findings from its Group.</text>
  </g>
</svg>
