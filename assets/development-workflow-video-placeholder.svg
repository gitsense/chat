<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Agent development workflow video placeholder</title>
  <desc id="description">A placeholder for a video showing agents asking what needs attention, selecting work, creating a Group and lead, and reporting it back.</desc>
  <rect width="1200" height="675" rx="24" fill="#f6f8fa"/>
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="3" stroke-dasharray="12 12"/>

  <text x="600" y="120" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700" text-anchor="middle">Agent development workflow</text>
  <text x="600" y="164" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" text-anchor="middle">Go from what needs attention to coordinated work.</text>

  <circle cx="600" cy="326" r="74" fill="#24292f"/>
  <path d="M578 282 L578 370 L648 326 Z" fill="#ffffff"/>

  <line x1="150" y1="510" x2="1050" y2="510" stroke="#d0d7de" stroke-width="4"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g>
      <circle cx="170" cy="510" r="18" fill="#0969da"/>
      <text x="170" y="517" fill="#ffffff" font-size="18" font-weight="700">1</text>
      <text x="170" y="560" fill="#24292f" font-size="18" font-weight="600">Ask</text>
    </g>
    <g>
      <circle cx="455" cy="510" r="18" fill="#0969da"/>
      <text x="455" y="517" fill="#ffffff" font-size="18" font-weight="700">2</text>
      <text x="455" y="560" fill="#24292f" font-size="18" font-weight="600">Choose</text>
    </g>
    <g>
      <circle cx="745" cy="510" r="18" fill="#0969da"/>
      <text x="745" y="517" fill="#ffffff" font-size="18" font-weight="700">3</text>
      <text x="745" y="560" fill="#24292f" font-size="18" font-weight="600">Create Group</text>
    </g>
    <g>
      <circle cx="1030" cy="510" r="18" fill="#0969da"/>
      <text x="1030" y="517" fill="#ffffff" font-size="18" font-weight="700">4</text>
      <text x="1030" y="560" fill="#24292f" font-size="18" font-weight="600">Report back</text>
    </g>
  </g>

  <text x="600" y="615" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle">Video placeholder</text>
</svg>
