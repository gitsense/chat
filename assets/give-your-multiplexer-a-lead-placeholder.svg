<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
  <title id="title">Give your multiplexer a lead video placeholder</title>
  <desc id="description">A placeholder for a GitSense Chat video showing twenty active sessions in a five by four grid with a lead monitoring them for agents stuck in a loop.</desc>
  <defs>
    <g id="session-card">
      <rect width="210" height="108" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
      <circle cx="20" cy="22" r="7" fill="#2da44e"/>
      <rect x="36" y="15" width="105" height="14" rx="5" fill="#57606a" opacity="0.8"/>
      <rect x="16" y="48" width="174" height="9" rx="4" fill="#d0d7de"/>
      <rect x="16" y="68" width="145" height="9" rx="4" fill="#d0d7de"/>
      <rect x="16" y="88" width="82" height="7" rx="3" fill="#afb8c1"/>
    </g>
  </defs>

  <rect width="1200" height="780" rx="24" fill="#f6f8fa"/>
  <rect x="24" y="24" width="1152" height="732" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="3" stroke-dasharray="12 12"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="48" y="76" fill="#24292f" font-size="30" font-weight="700">20 active sessions</text>
    <text x="48" y="108" fill="#57606a" font-size="19">One lead monitoring the work across every pane</text>
    <rect x="902" y="58" width="226" height="50" rx="9" fill="#ddf4ff" stroke="#54aeff" stroke-width="2"/>
    <text x="1015" y="90" fill="#0969da" font-size="18" font-weight="600" text-anchor="middle">Checking for stuck loops</text>
  </g>

  <g transform="translate(48 146)">
    <rect width="210" height="108" rx="10" fill="#f0f7ff" stroke="#0969da" stroke-width="3"/>
    <circle cx="20" cy="22" r="7" fill="#0969da"/>
    <text x="36" y="28" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Lead agent</text>
    <rect x="16" y="48" width="174" height="9" rx="4" fill="#54aeff" opacity="0.7"/>
    <rect x="16" y="68" width="145" height="9" rx="4" fill="#54aeff" opacity="0.55"/>
    <rect x="16" y="88" width="92" height="7" rx="3" fill="#0969da" opacity="0.6"/>
  </g>
  <use href="#session-card" x="270" y="146"/>
  <use href="#session-card" x="492" y="146"/>
  <use href="#session-card" x="714" y="146"/>
  <use href="#session-card" x="936" y="146"/>

  <use href="#session-card" x="48" y="270"/>
  <use href="#session-card" x="270" y="270"/>
  <use href="#session-card" x="492" y="270"/>
  <use href="#session-card" x="714" y="270"/>
  <use href="#session-card" x="936" y="270"/>

  <use href="#session-card" x="48" y="394"/>
  <use href="#session-card" x="270" y="394"/>
  <use href="#session-card" x="492" y="394"/>
  <use href="#session-card" x="714" y="394"/>
  <use href="#session-card" x="936" y="394"/>

  <use href="#session-card" x="48" y="518"/>
  <use href="#session-card" x="270" y="518"/>
  <use href="#session-card" x="492" y="518"/>
  <use href="#session-card" x="714" y="518"/>
  <use href="#session-card" x="936" y="518"/>

  <text x="600" y="714" fill="#8c959f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle">Video placeholder</text>
</svg>
